[functions.provision-waiter]
verify_jwt = true

[functions.manage-waiter-password]
verify_jwt = true

[functions.reset-owner-password]
verify_jwt = true

[functions.platform-admin]
verify_jwt = true

# Bootstrap endpoint. Not JWT-gated because the founder has no session yet;
# it is guarded instead by the PLATFORM_ADMIN_SETUP_SECRET header and is
# disabled entirely when that secret is unset.
[functions.platform-admin-setup]
verify_jwt = false

# Founder username+password login. No JWT yet at sign-in time; authorization is
# enforced by checking the resulting user against public.platform_admins.
[functions.platform-admin-auth]
verify_jwt = false
